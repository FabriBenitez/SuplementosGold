<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../CSS/style.css">
</head>
<body>
    <button class="boton-volver" onclick="window.location.href='../../index.html'">&#10229; Volver</button>

    <div class="login-container">
        <div class="login-header">
            <h1>&#128062; Suplementos Cuco (Solo Admins)</h1>
            <p>Ingresa tus credenciales para acceder</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>


            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <div class="input-password-container">
                    <input type="password" id="contrasena" name="contrasena" required>
                    <img id="togglePassword" 
                        class="toggle-password" 
                        src="../../SVG/No-Ve-Contraseña.svg" 
                        alt="Mostrar contraseña">
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                Iniciar Sesión
            </button>
        </form>
    </div>
    <script type="module" src="../../JS/Auth/validar-login.js"></script>
</body>


</html>
